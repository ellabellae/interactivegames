<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kitchen Race</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #16213a; --panel: rgba(255,255,255,0.9); --p1: #ff8a00; --p2: #2f80ed; --good: #2ecc71; --meter: #ffcf3f; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a12; color: var(--ink); font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-size: 17px; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); filter: brightness(0.7) saturate(1.1); }
  #hands { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .divider { position: fixed; top: 0; bottom: 0; left: 50%; width: 3px; background: rgba(255,255,255,0.55); z-index: 2; }
  .top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 10; display: flex; justify-content: center; gap: 12px; padding: 12px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .pill { background: var(--panel); border-radius: 999px; padding: 8px 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  button, select { font: inherit; font-weight: 600; color: var(--ink); background: #fff; border: 2px solid rgba(22,33,58,0.2); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button.go { background: var(--good); border-color: var(--good); color: #10331f; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--p2); outline-offset: 2px; }

  .zone { position: fixed; top: 0; bottom: 0; width: 50%; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 70px 14px 20px; touch-action: none; }
  .zone.p1 { left: 0; } .zone.p2 { right: 0; }
  .who { background: var(--panel); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 18px; display: flex; gap: 10px; align-items: center; }
  .who i { width: 14px; height: 14px; border-radius: 50%; } .p1 .who i { background: var(--p1); } .p2 .who i { background: var(--p2); }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .step { background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 15px; font-weight: 600; opacity: 0.55; }
  .step.now { opacity: 1; outline: 3px solid var(--meter); } .step.done { opacity: 1; background: var(--good); color: #10331f; }
  .station { position: relative; width: min(92%, 460px); aspect-ratio: 16 / 10; background: var(--panel); border-radius: 22px; overflow: hidden; }
  .p1 .station { box-shadow: 0 0 0 4px var(--p1); } .p2 .station { box-shadow: 0 0 0 4px var(--p2); }
  .counter { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 62%, rgba(214,170,120,0.55) 62%); }
  .item { position: absolute; transform: translate(-50%, -50%); font-size: 64px; line-height: 1; user-select: none; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.15)); }
  .item.small { font-size: 44px; }
  .item.zone-ring::before { content: ""; position: absolute; inset: -14px; border: 3px dashed rgba(22,33,58,0.3); border-radius: 50%; }
  .item.hot::before { border-color: var(--p1); }
  .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-weight: 700; font-size: clamp(15px, 2vw, 20px); color: var(--ink); }
  .hint span { display: block; font-weight: 400; font-size: 14px; opacity: 0.75; }
  .meter { position: absolute; left: 14px; right: 14px; top: 12px; height: 14px; background: rgba(22,33,58,0.12); border-radius: 99px; overflow: hidden; }
  .meter div { height: 100%; width: 0; background: var(--meter); transition: width 120ms linear; }
  .held { position: fixed; z-index: 50; font-size: 56px; transform: translate(-50%, -50%) rotate(-8deg); pointer-events: none; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.35)); }
  .bing { position: absolute; z-index: 60; font-weight: 700; font-size: 26px; color: var(--ink); pointer-events: none; animation: rise 800ms ease forwards; text-shadow: 0 2px 0 #fff; left: 50%; top: 40%; }
  @keyframes rise { 0% { opacity: 1; transform: translate(-50%, 0) scale(1.2) } 100% { opacity: 0; transform: translate(-50%, -60px) scale(1) } }
  .puff { position: absolute; font-size: 28px; pointer-events: none; animation: puff 600ms ease forwards; }
  @keyframes puff { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6) } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1.3) } }
  @media (prefers-reduced-motion: reduce) { .bing, .puff { animation: none; opacity: 0; } }

  .overlay { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; background: rgba(42,26,18,0.6); padding: 20px; text-align: center; }
  .overlay.on { display: grid; }
  .overlay > div { background: #fff; border-radius: 22px; padding: 26px 32px; max-width: 460px; }
  .overlay h2 { font-size: 34px; margin: 0 0 8px; } .overlay p { margin: 0 0 14px; color: #4b5a70; }
  .overlay .big { font-size: 96px; font-weight: 700; line-height: 1; margin: 6px 0 10px; }
  canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; width: 100%; height: 100%; }
  #status { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 20; background: var(--panel); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  #status.hidden { display: none; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<div class="divider"></div>
<canvas id="hands"></canvas>

<div class="top">
  <div class="pill"><select id="recipeSel" aria-label="Choose a dish"></select></div>
  <div class="pill" id="clock">0:00</div>
  <button id="music" aria-pressed="true">Music on</button>
  <button class="go" id="start">Start cooking</button>
</div>

<div class="zone p1" data-p="0"><div class="who"><i></i>Player 1</div><div class="steps" id="steps1"></div><div class="station" id="station1"></div></div>
<div class="zone p2" data-p="1"><div class="who"><i></i>Player 2</div><div class="steps" id="steps2"></div><div class="station" id="station2"></div></div>

<div id="status">Starting camera…</div>
<div class="overlay" id="countdown"><div><p id="countHint">Aprons on. One cook on each side of the screen.</p><div class="big" id="countNum">3</div></div></div>
<div class="overlay" id="winner"><div><h2 id="winTitle"></h2><p id="winText"></p><button class="go" id="again">Cook again</button></div></div>
<canvas class="confetti" id="confetti"></canvas>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// =============== sound: effects and a little looping tune, all synthesised ===============
let audio = null, musicOn = true, musicTimer = null, nextNoteTime = 0, stepIdx = 0, bpm = 138;
function ensureAudio() { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); }
function tone(f, start, dur, type = "sine", gain = 0.22, when = null) {
  const t0 = (when ?? audio.currentTime) + start, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, gain = 0.15, hp = 800, when = null) {
  const t0 = when ?? audio.currentTime, buf = audio.createBuffer(1, audio.sampleRate * dur, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  s.buffer = buf; f.type = "highpass"; f.frequency.value = hp; g.gain.value = gain;
  s.connect(f).connect(g).connect(audio.destination); s.start(t0);
}
const bing = () => audio && (tone(1046, 0, 0.5), tone(1568, 0.06, 0.6));
const chop = () => audio && (tone(220, 0, 0.08, "square", 0.12), noise(0.06, 0.2, 2000));
const swish = () => audio && noise(0.12, 0.06, 1500);
const crackSfx = () => audio && (noise(0.05, 0.25, 3000), tone(330, 0, 0.1, "triangle", 0.15));
const sizzle = () => audio && noise(0.5, 0.08, 4000);
const shake = () => audio && noise(0.04, 0.12, 5000);
const dingdong = () => audio && (tone(659, 0, 0.35), tone(523, 0.18, 0.5));
const fanfare = () => audio && ([523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.12, 0.5)), tone(1318, 0.5, 0.9));
const countTick = () => audio && tone(660, 0, 0.12, "square", 0.08);

// 16-step tune in C major. 0 = rest. Kitchen-timer bouncy.
const MELODY = [523, 0, 659, 784, 0, 659, 523, 0, 587, 0, 698, 880, 0, 784, 659, 0,
                523, 0, 659, 784, 0, 880, 1046, 0, 988, 0, 784, 659, 0, 587, 523, 0];
const BASS   = [131, 0, 131, 0, 175, 0, 175, 0, 196, 0, 196, 0, 175, 0, 131, 0,
                131, 0, 131, 0, 175, 0, 175, 0, 196, 0, 220, 0, 196, 0, 131, 0];
function scheduleMusic() {
  if (!audio || !musicOn) return;
  const step = 60 / bpm / 2;
  while (nextNoteTime < audio.currentTime + 0.15) {
    const i = stepIdx % MELODY.length;
    if (MELODY[i]) tone(MELODY[i], 0, step * 0.9, "square", 0.05, nextNoteTime);
    if (BASS[i]) tone(BASS[i], 0, step * 1.6, "triangle", 0.12, nextNoteTime);
    if (i % 2 === 0) noise(0.03, i % 4 === 0 ? 0.08 : 0.04, 6000, nextNoteTime);
    nextNoteTime += step; stepIdx++;
  }
}
function startMusic() { ensureAudio(); stepIdx = 0; nextNoteTime = audio.currentTime + 0.05; clearInterval(musicTimer); musicTimer = setInterval(scheduleMusic, 60); }
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

// =============== recipes: each step is a gesture mini-game ===============
// Gesture kinds: pinchdrop (pinch, move over a spot, release), stir (circles), chop (up and down), flick (fast upward swipe), shake (pinch and wiggle), drag (pinch item, carry to target).
const RECIPES = {
  "Pancakes": [
    { name: "Crack eggs", kind: "pinchdrop", need: 3, from: "🥚", into: "🥣", hint: "Pinch an egg and let go over the bowl", sfx: crackSfx },
    { name: "Stir batter", kind: "stir", need: 4, at: "🥣", hint: "Make big circles over the bowl", sfx: swish },
    { name: "Pour", kind: "drag", need: 1, from: "🥣", into: "🍳", hint: "Pinch the bowl and carry it to the pan", sfx: sizzle },
    { name: "Flip", kind: "flick", need: 3, at: "🍳", hint: "Flick your hand straight up, fast", sfx: sizzle },
    { name: "Plate up", kind: "drag", need: 1, from: "🥞", into: "🍽️", hint: "Pinch the pancakes and carry them to the plate", sfx: dingdong },
  ],
  "Stir-fry": [
    { name: "Chop veggies", kind: "chop", need: 14, at: "🥕", hint: "Chop! Move your hand up and down over the board", sfx: chop },
    { name: "Into the wok", kind: "drag", need: 1, from: "🥕", into: "🥘", hint: "Pinch the veggies and carry them to the wok", sfx: sizzle },
    { name: "Season", kind: "shake", need: 10, from: "🧂", at: "🥘", hint: "Pinch the shaker and wiggle it side to side", sfx: shake },
    { name: "Toss", kind: "stir", need: 4, at: "🥘", hint: "Big circles over the wok", sfx: swish },
    { name: "Plate up", kind: "drag", need: 1, from: "🍜", into: "🍽️", hint: "Pinch the stir-fry and carry it to the plate", sfx: dingdong },
  ],
  "Sundae": [
    { name: "Scoop", kind: "pinchdrop", need: 3, from: "🍨", into: "🍧", hint: "Pinch a scoop and let go over the cup", sfx: crackSfx },
    { name: "Chop banana", kind: "chop", need: 10, at: "🍌", hint: "Chop! Up and down over the banana", sfx: chop },
    { name: "Add banana", kind: "drag", need: 1, from: "🍌", into: "🍧", hint: "Pinch the banana and carry it to the cup", sfx: swish },
    { name: "Sprinkles", kind: "shake", need: 10, from: "🧁", at: "🍧", hint: "Pinch the sprinkles and wiggle side to side", sfx: shake },
    { name: "Cherry on top", kind: "flick", need: 2, at: "🍒", hint: "Flick your hand up to toss the cherry", sfx: dingdong },
  ],
};

// =============== game state ===============
const $ = (id) => document.getElementById(id);
let running = false, startTime = 0, clockTimer = null;
const players = [0, 1].map((p) => ({
  p, station: $(`station${p + 1}`), stepsEl: $(`steps${p + 1}`), recipe: [], si: 0, count: 0,
  input: null, pinch: false, wasPinch: false, cursorSmooth: null, hand: null, releaseFrames: 0, pinchFrames: 0,
  g: {},   // gesture scratch state
}));

function layoutStation(pl) {
  const st = pl.station, step = pl.recipe[pl.si];
  st.innerHTML = `<div class="counter"></div><div class="meter"><div></div></div>`;
  if (!step) return;
  const put = (emoji, x, y, cls = "") => { const d = document.createElement("div"); d.className = "item " + cls; d.textContent = emoji; d.style.left = x + "%"; d.style.top = y + "%"; st.appendChild(d); return d; };
  if (step.kind === "pinchdrop" || step.kind === "drag") { pl.src = put(step.from, 24, 52, "small zone-ring"); pl.dst = put(step.into, 72, 52, "zone-ring hot"); }
  else if (step.kind === "shake") { pl.src = put(step.from, 24, 52, "small zone-ring"); pl.dst = put(step.at, 72, 52, ""); }
  else { pl.src = null; pl.dst = put(step.at, 50, 52, "zone-ring hot"); }
  const h = document.createElement("div"); h.className = "hint"; h.innerHTML = `${step.hint}<span>${step.need > 1 ? `${step.need} times` : ""}</span>`; st.appendChild(h);
  pl.stepsEl.innerHTML = pl.recipe.map((s, i) => `<div class="step ${i < pl.si ? "done" : i === pl.si ? "now" : ""}">${i < pl.si ? "✓ " : ""}${s.name}</div>`).join("");
}
function setup() {
  const r = RECIPES[$("recipeSel").value];
  players.forEach((pl) => { pl.recipe = r; pl.si = 0; pl.count = 0; pl.g = {}; dropHeld(pl); layoutStation(pl); });
  $("clock").textContent = "0:00"; bpm = 138;
}
function centreOf(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: Math.max(r.width, r.height) / 2 + 26 }; }
const near = (pt, el) => { if (!pt || !el) return false; const c = centreOf(el); return Math.hypot(pt.x - c.x, pt.y - c.y) < c.r; };
function progress(pl, sfx = true) {
  const step = pl.recipe[pl.si]; pl.count++;
  pl.station.querySelector(".meter div").style.width = (100 * pl.count / step.need) + "%";
  if (sfx) step.sfx();
  if (pl.count >= step.need) { pl.count = 0; pl.si++; pl.g = {}; dropHeld(pl); bing(); pop(pl, "Bing!"); bpm = Math.min(176, 138 + 8 * Math.max(...players.map((q) => q.si)));
    if (pl.si >= pl.recipe.length) finish(pl); else layoutStation(pl); }
}
function pop(pl, text) { const t = document.createElement("div"); t.className = "bing"; t.textContent = text; pl.station.appendChild(t); setTimeout(() => t.remove(), 850); }
function puff(pl, emoji, pt) { const r = pl.station.getBoundingClientRect(), d = document.createElement("div"); d.className = "puff"; d.textContent = emoji; d.style.left = (pt.x - r.left) + "px"; d.style.top = (pt.y - r.top) + "px"; pl.station.appendChild(d); setTimeout(() => d.remove(), 650); }
function hold(pl, emoji) { dropHeld(pl); const d = document.createElement("div"); d.className = "held"; d.textContent = emoji; document.body.appendChild(d); pl.held = d; }
function dropHeld(pl) { if (pl.held) { pl.held.remove(); pl.held = null; } }

// the gesture logic: runs every frame with the player's current cursor and pinch state
function updateGesture(pl, dt) {
  const step = pl.recipe[pl.si], inp = pl.input; if (!step || !running) return;
  const pinch = !!(inp && inp.pinch), justPinched = pinch && !pl.wasPinch, justReleased = !pinch && pl.wasPinch, g = pl.g;
  const pt = inp ? { x: inp.x, y: inp.y } : null;
  if (pl.held && pt) { pl.held.style.left = pt.x + "px"; pl.held.style.top = pt.y + "px"; }

  switch (step.kind) {
    case "pinchdrop":
      if (justPinched && near(pt, pl.src)) hold(pl, step.from);
      if (justReleased && pl.held) { if (near(pt, pl.dst)) { puff(pl, step.from, pt); progress(pl); } dropHeld(pl); }
      break;
    case "drag":
      if (justPinched && near(pt, pl.src)) { hold(pl, step.from); pl.src.style.opacity = 0.25; }
      if (justReleased && pl.held) { dropHeld(pl); if (near(pt, pl.dst)) progress(pl); else pl.src.style.opacity = 1; }
      break;
    case "stir": {
      if (!pt || !near(pt, pl.dst)) { g.lastAng = null; break; }
      const c = centreOf(pl.dst), ang = Math.atan2(pt.y - c.y, pt.x - c.x);
      if (g.lastAng != null) { let d = ang - g.lastAng; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; g.acc = (g.acc || 0) + Math.abs(d);
        if (g.acc > 2 * Math.PI) { g.acc = 0; progress(pl); puff(pl, "✨", pt); } else if (Math.random() < 0.08) swish(); }
      g.lastAng = ang; break; }
    case "chop": {
      if (!pt || !near(pt, pl.dst)) { g.prevY = null; break; }
      if (g.prevY != null) { const dir = Math.sign(pt.y - g.prevY); if (dir && g.dir && dir !== g.dir && Math.abs(pt.y - (g.extY ?? pt.y)) > 22) { g.extY = pt.y; if (dir > 0) { progress(pl); puff(pl, "🔪", pt); } } if (dir) g.dir = dir; if (g.extY == null) g.extY = pt.y; }
      g.prevY = pt.y; break; }
    case "flick": {
      if (!pt) { g.prevY = null; break; }
      if (g.prevY != null && dt > 0) { const vy = (g.prevY - pt.y) / dt; g.cool = Math.max(0, (g.cool || 0) - dt);
        if (vy > 1100 && g.cool === 0 && near({ x: pt.x, y: g.prevY }, pl.dst)) { g.cool = 0.6; progress(pl); puff(pl, step.at === "🍒" ? "🍒" : "🥞", pt); } }
      g.prevY = pt.y; break; }
    case "shake": {
      if (justPinched && near(pt, pl.src)) hold(pl, step.from);
      if (justReleased) dropHeld(pl);
      if (pl.held && pt && near(pt, pl.dst)) { if (g.prevX != null) { const dir = Math.sign(pt.x - g.prevX); if (dir && g.dir && dir !== g.dir && Math.abs(pt.x - (g.extX ?? pt.x)) > 14) { g.extX = pt.x; progress(pl); if (Math.random() < 0.5) puff(pl, "✨", pt); } if (dir) g.dir = dir; if (g.extX == null) g.extX = pt.x; } g.prevX = pt.x; } else g.prevX = null;
      break; }
  }
  pl.wasPinch = pinch;
}

// =============== input: hands by half of the screen, pointer as fallback ===============
const pointerOwner = new Map();
document.addEventListener("pointerdown", (e) => { if (e.target.closest("button, select, label")) return; ensureAudio(); const pl = players[e.clientX < innerWidth / 2 ? 0 : 1]; pointerOwner.set(e.pointerId, pl); pl.input = { x: e.clientX, y: e.clientY, pinch: true, src: "ptr" }; e.preventDefault(); });
document.addEventListener("pointermove", (e) => { const pl = pointerOwner.get(e.pointerId); if (pl) pl.input = { x: e.clientX, y: e.clientY, pinch: true, src: "ptr" }; });
const endPtr = (e) => { const pl = pointerOwner.get(e.pointerId); if (!pl) return; pointerOwner.delete(e.pointerId); pl.input = { x: e.clientX, y: e.clientY, pinch: false, src: "ptr" }; setTimeout(() => { if (pl.input && pl.input.src === "ptr" && !pl.input.pinch) pl.input = null; }, 50); };
document.addEventListener("pointerup", endPtr); document.addEventListener("pointercancel", endPtr);

const video = $("video"), handCanvas = $("hands"), hctx = handCanvas.getContext("2d");
let landmarker = null, lastVideoTime = -1;
async function startCamera() { const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 1280, height: 720 }, audio: false }); video.srcObject = s; await new Promise((r) => (video.onloadedmetadata = r)); await video.play(); }
async function startTracking() {
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" }, runningMode: "VIDEO", numHands: 2 });
}
function readHands() {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return null;
  lastVideoTime = video.currentTime;
  const vw = video.videoWidth || 16, vh = video.videoHeight || 9, s = Math.max(innerWidth / vw, innerHeight / vh), ox = (innerWidth - vw * s) / 2, oy = (innerHeight - vh * s) / 2;
  return (landmarker.detectForVideo(video, performance.now()).landmarks || []).map((lm) => {
    const m = lm.map((p) => ({ x: ox + (1 - p.x) * vw * s, y: oy + p.y * vh * s }));
    const size = Math.hypot(m[0].x - m[9].x, m[0].y - m[9].y) || 1;
    return { pt: { x: (m[4].x + m[8].x) / 2, y: (m[4].y + m[8].y) / 2 }, palmX: m[9].x, pinchDist: Math.hypot(m[4].x - m[8].x, m[4].y - m[8].y) / size, lm: m };
  });
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const hands = readHands();
  if (hands) {
    players.forEach((pl) => {
      const h = hands.filter((x) => (x.palmX < innerWidth / 2) === (pl.p === 0))[0];
      if (!h) { if (pl.input && pl.input.src === "hand" && ++pl.releaseFrames > 10) { pl.input = null; pl.cursorSmooth = null; } pl.hand = null; return; }
      pl.releaseFrames = 0; pl.hand = h;
      pl.cursorSmooth = pl.cursorSmooth ? { x: pl.cursorSmooth.x + (h.pt.x - pl.cursorSmooth.x) * 0.55, y: pl.cursorSmooth.y + (h.pt.y - pl.cursorSmooth.y) * 0.55 } : { ...h.pt };
      const want = pl.pinch ? h.pinchDist < 0.42 : h.pinchDist < 0.3;
      pl.pinchFrames = want ? pl.pinchFrames + 1 : 0;
      if (!pl.pinch && pl.pinchFrames >= 2) pl.pinch = true; if (pl.pinch && !want) pl.pinch = false;
      if (!pointerOwner.size || !(pl.input && pl.input.src === "ptr")) pl.input = { x: pl.cursorSmooth.x, y: pl.cursorSmooth.y, pinch: pl.pinch, src: "hand" };
    });
  }
  players.forEach((pl) => updateGesture(pl, dt));
  // draw hands
  hctx.clearRect(0, 0, handCanvas.width, handCanvas.height); const dpr = Math.min(devicePixelRatio, 2); hctx.save(); hctx.scale(dpr, dpr);
  players.forEach((pl) => {
    const h = pl.hand; if (!h || !pl.cursorSmooth) return; const col = pl.p === 0 ? "#ff8a00" : "#2f80ed";
    hctx.strokeStyle = col; hctx.lineWidth = 2; hctx.globalAlpha = 0.6; hctx.beginPath();
    for (const cn of HandLandmarker.HAND_CONNECTIONS) { hctx.moveTo(h.lm[cn.start].x, h.lm[cn.start].y); hctx.lineTo(h.lm[cn.end].x, h.lm[cn.end].y); }
    hctx.stroke(); hctx.globalAlpha = 1;
    hctx.beginPath(); hctx.arc(pl.cursorSmooth.x, pl.cursorSmooth.y, pl.pinch ? 10 : 16, 0, Math.PI * 2); hctx.lineWidth = 4; hctx.strokeStyle = "#fff"; hctx.stroke(); hctx.strokeStyle = col; hctx.lineWidth = 2; hctx.stroke();
    if (pl.pinch) { hctx.fillStyle = col; hctx.fill(); }
  });
  hctx.restore();
  requestAnimationFrame(frame);
}

// =============== race flow ===============
function startRace() {
  ensureAudio(); setup(); running = false; if (musicOn) startMusic();
  const ov = $("countdown"); ov.classList.add("on"); let n = 3; $("countNum").textContent = n; countTick();
  const iv = setInterval(() => { n--; if (n > 0) { $("countNum").textContent = n; countTick(); return; }
    clearInterval(iv); $("countNum").textContent = "Cook!"; tone(880, 0, 0.4, "square", 0.1);
    setTimeout(() => { ov.classList.remove("on"); running = true; startTime = Date.now(); clearInterval(clockTimer); clockTimer = setInterval(clockTick, 500); }, 500); }, 800);
}
function clockTick() { const s = Math.floor((Date.now() - startTime) / 1000); $("clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function finish(winner) {
  running = false; clearInterval(clockTimer); clockTick(); stopMusic(); fanfare(); confetti();
  const other = players[1 - winner.p];
  $("winTitle").textContent = `Player ${winner.p + 1} serves first!`;
  $("winText").textContent = `${$("recipeSel").value} done in ${$("clock").textContent}. Player ${other.p + 1} was on step ${Math.min(other.si + 1, other.recipe.length)} of ${other.recipe.length}: ${other.recipe[Math.min(other.si, other.recipe.length - 1)].name}.`;
  setTimeout(() => $("winner").classList.add("on"), 900);
}
function confetti() {
  const cv = $("confetti"), ctx = cv.getContext("2d"); cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ["#ff8a00", "#2f80ed", "#ffcf3f", "#2ecc71", "#ff6fa8", "#fff"], bits = Array.from({ length: 140 }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * 200, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3, s: 6 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * Math.PI }));
  let frames = 0; (function loop() { ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits.forEach((b) => { b.x += b.vx; b.y += b.vy; b.r += 0.08; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 3, b.s, b.s * 0.66); ctx.restore(); });
    if (++frames < 220) requestAnimationFrame(loop); else ctx.clearRect(0, 0, innerWidth, innerHeight); })();
}

// =============== wiring ===============
Object.keys(RECIPES).forEach((k) => { const o = document.createElement("option"); o.textContent = k; $("recipeSel").appendChild(o); });
$("recipeSel").addEventListener("change", () => { if (!running) setup(); });
$("start").addEventListener("click", startRace);
$("again").addEventListener("click", () => { $("winner").classList.remove("on"); const s = $("recipeSel"); s.selectedIndex = (s.selectedIndex + 1) % s.options.length; startRace(); });
$("music").addEventListener("click", () => { musicOn = !musicOn; $("music").textContent = musicOn ? "Music on" : "Music off"; $("music").setAttribute("aria-pressed", musicOn); if (musicOn && running) startMusic(); if (!musicOn) stopMusic(); });
function resize() { const dpr = Math.min(devicePixelRatio, 2); handCanvas.width = innerWidth * dpr; handCanvas.height = innerHeight * dpr; }
addEventListener("resize", resize); resize(); setup(); requestAnimationFrame(frame);
(async () => {
  try { await startCamera(); $("status").textContent = "Loading hand tracking…"; await startTracking(); $("status").classList.add("hidden"); }
  catch (err) { console.error(err); $("status").textContent = err && err.name === "NotAllowedError" ? "Camera blocked. Allow camera access for this page and reload. Mouse and touch still work." : "Hand tracking didn't load. Check the internet connection and reload. Mouse and touch still work."; }
})();
</script>
