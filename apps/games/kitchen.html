<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kitchen Race</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #16213a; --panel: rgba(255,255,255,0.9); --p1: #ff8a00; --p2: #2f80ed; --good: #2ecc71; --meter: #ffcf3f; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a12; color: var(--ink); font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-size: 17px; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); filter: brightness(0.7) saturate(1.1); }
  #hands { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .divider { position: fixed; top: 0; bottom: 0; left: 50%; width: 3px; background: rgba(255,255,255,0.55); z-index: 2; }
  .top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 10; display: flex; justify-content: center; gap: 12px; padding: 12px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .pill { background: var(--panel); border-radius: 999px; padding: 8px 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  button, select { font: inherit; font-weight: 600; color: var(--ink); background: #fff; border: 2px solid rgba(22,33,58,0.2); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button.go { background: var(--good); border-color: var(--good); color: #10331f; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--p2); outline-offset: 2px; }

  .zone { position: fixed; top: 0; bottom: 0; width: 50%; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 70px 14px 20px; touch-action: none; }
  .zone.p1 { left: 0; } .zone.p2 { right: 0; }
  .who { background: var(--panel); border-radius: 999px; padding: 6px 16px; font-weight: 700; font-size: 18px; display: flex; gap: 10px; align-items: center; }
  .who i { width: 14px; height: 14px; border-radius: 50%; } .p1 .who i { background: var(--p1); } .p2 .who i { background: var(--p2); }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .step { background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 15px; font-weight: 600; opacity: 0.55; }
  .step.now { opacity: 1; outline: 3px solid var(--meter); } .step.done { opacity: 1; background: var(--good); color: #10331f; }
  .station { position: relative; width: min(92%, 460px); aspect-ratio: 16 / 10; background: var(--panel); border-radius: 22px; overflow: hidden; }
  .p1 .station { box-shadow: 0 0 0 4px var(--p1); } .p2 .station { box-shadow: 0 0 0 4px var(--p2); }
  .counter { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 62%, rgba(214,170,120,0.55) 62%); }
  .item { position: absolute; transform: translate(-50%, -50%); font-size: 64px; line-height: 1; user-select: none; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.15)); }
  .item.small { font-size: 44px; }
  .item.zone-ring::before { content: ""; position: absolute; inset: -14px; border: 3px dashed rgba(22,33,58,0.3); border-radius: 50%; }
  .item.hot::before { border-color: var(--p1); }
  .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-weight: 700; font-size: clamp(15px, 2vw, 20px); color: var(--ink); }
  .hint span { display: block; font-weight: 400; font-size: 14px; opacity: 0.75; }
  .meter { position: absolute; left: 14px; right: 14px; top: 12px; height: 14px; background: rgba(22,33,58,0.12); border-radius: 99px; overflow: hidden; }
  .meter div { height: 100%; width: 0; background: var(--meter); transition: width 120ms linear; }
  .held { position: fixed; z-index: 50; font-size: 56px; transform: translate(-50%, -50%) rotate(-8deg); pointer-events: none; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.35)); }
  .bing { position: absolute; z-index: 60; font-weight: 700; font-size: 26px; color: var(--ink); pointer-events: none; animation: rise 800ms ease forwards; text-shadow: 0 2px 0 #fff; left: 50%; top: 40%; }
  @keyframes rise { 0% { opacity: 1; transform: translate(-50%, 0) scale(1.2) } 100% { opacity: 0; transform: translate(-50%, -60px) scale(1) } }
  .puff { position: absolute; font-size: 28px; pointer-events: none; animation: puff 600ms ease forwards; }
  @keyframes puff { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6) } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1.3) } }
  @media (prefers-reduced-motion: reduce) { .bing, .puff { animation: none; opacity: 0; } }

  .overlay { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; background: rgba(42,26,18,0.6); padding: 20px; text-align: center; }
  .overlay.on { display: grid; }
  .overlay > div { background: #fff; border-radius: 22px; padding: 26px 32px; max-width: 460px; }
  .overlay h2 { font-size: 34px; margin: 0 0 8px; } .overlay p { margin: 0 0 14px; color: #4b5a70; }
  .overlay .big { font-size: 96px; font-weight: 700; line-height: 1; margin: 6px 0 10px; }
  canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; width: 100%; height: 100%; }
  #status { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 20; background: var(--panel); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  #status.hidden { display: none; }
  a.pill { color: inherit; text-decoration: none; }
  /* solo: one station in the middle, any hand */
  body.solo .divider, body.solo .zone.p2 { display: none; }
  body.solo .zone.p1 { width: 100%; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<div class="divider"></div>
<canvas id="hands"></canvas>

<div class="top">
  <a class="pill" href="./index.html" aria-label="Back to games">← Games</a>
  <div class="pill"><select id="modeSel" aria-label="Game mode"><option value="race">Race</option><option value="solo">Solo</option></select><select id="recipeSel" aria-label="Choose a dish"></select><select id="profileSel" aria-label="Profile"></select></div>
  <div class="pill" id="clock">0:00</div>
  <button id="music" aria-pressed="true">Music on</button>
  <button class="go" id="start">Start cooking</button>
</div>

<div class="zone p1" data-p="0"><div class="who"><i></i>Player 1</div><div class="steps" id="steps1"></div><div class="station" id="station1"></div></div>
<div class="zone p2" data-p="1"><div class="who"><i></i>Player 2</div><div class="steps" id="steps2"></div><div class="station" id="station2"></div></div>

<div id="status">Starting camera…</div>
<div class="overlay" id="countdown"><div><p id="countHint">Aprons on. One cook on each side of the screen.</p><div class="big" id="countNum">3</div></div></div>
<div class="overlay" id="winner"><div><h2 id="winTitle"></h2><p id="winText"></p><button class="go" id="again">Cook again</button></div></div>
<canvas class="confetti" id="confetti"></canvas>

<script type="module" src="./src/kitchen.js"></script>
</body>
</html>
