<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hand games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #16213a; --panel: rgba(255,255,255,0.9); --p1: #ff8a00; --p2: #2f80ed; --good: #2ecc71; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; background: #0c1a2e; color: var(--ink); font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-size: 17px; }
  main { display: grid; gap: 16px; place-content: center; min-height: 100vh; padding: 20px; }
  h1 { color: #fff; text-align: center; margin: 0 0 4px; }
  a.card { display: block; background: var(--panel); border-radius: 22px; padding: 22px 28px; max-width: 460px; color: inherit; text-decoration: none; }
  a.card:focus-visible { outline: 3px solid var(--p2); outline-offset: 2px; }
  a.card h2 { margin: 0 0 6px; } a.card p { margin: 0; color: #4b5a70; }
  .home { color: #fff; text-align: center; }
  .profile { background: var(--panel); border-radius: 22px; padding: 14px 20px; max-width: 460px; }
  .profile label { font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .profile select { font: inherit; font-weight: 600; color: var(--ink); background: #fff; border: 2px solid rgba(22,33,58,0.2); border-radius: 999px; padding: 6px 14px; }
  .profile select:focus-visible { outline: 3px solid var(--p2); outline-offset: 2px; }
  .profile p { margin: 8px 0 0; color: #4b5a70; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Hand games</h1>
  <div class="profile">
    <label>Profile <select id="profileSel" aria-label="Profile"></select></label>
    <p id="profileNote"></p>
  </div>
  <a class="card" href="./kitchen.html"><h2>🍳 Kitchen</h2><p>Crack, stir, chop, shake and flip through a recipe. Two cooks race, one on each side of the screen.</p></a>
  <a class="card" href="./bricks.html"><h2>🧱 Bricks</h2><p>Copy the picture brick by brick. Race on two boards, or build one together.</p></a>
  <a class="home" href="../index.html">← Home</a>
</main>
<script type="module" src="./src/menu.js"></script>
</body>
</html>
